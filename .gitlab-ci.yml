# Katana CI — run the project's own gates on every push.
#
# The point of this pipeline is not decoration. Katana's central claim is that a
# construct is reproducible and that the checks fail closed. A claim like that is
# worth exactly as much as the last time somebody ran it, so it runs here, on a
# clean machine that is not ours, every commit.
#
# Three jobs, deliberately separated so a red pipeline says WHICH property broke:
#
#   verify        the library is intact, and the checker still catches tampering
#                 (verify.py corrupts a scratch copy eight ways and expects eight catches)
#   determinism   every Design Spec still rebuilds to its recorded sealed hash,
#                 and a wrong library pin / edited manifest is still refused
#   minimal       the engine works with ONLY its required dependency installed
#   kagami        the auditor a stranger is invited to run still works on a bare machine
#                 (no blastn: an annotated file is still checked by exact match)
#   bootstrap     the setup script works before anything is installed, and reads its pins
#                 from requirements.txt instead of keeping a second copy of them
#
# `minimal` exists because the other two install everything. Optional extras are
# supposed to degrade to a loud warning, never a crash — and the only way to know
# that is still true is to run without them.

stages: [test]

default:
  image: python:3.12
  before_script:
    - python --version

# Full install: PyYAML + the optional CAI and SBOL extras, so the optional gates
# actually execute rather than being skipped.
.full: &full
  stage: test
  before_script:
    - python --version
    - pip install --no-cache-dir -r requirements.txt

verify:
  <<: *full
  script:
    # Exits non-zero if any part mismatches its manifest, or if any of the eight
    # deliberate corruptions goes UNcaught.
    - python verify.py

determinism:
  <<: *full
  script:
    # Oracle (every Spec -> its recorded hash), repeatability, wrong-pin refused,
    # tampered-manifest refused, and the SBOL export round-tripping to the same hash.
    - python test_determinism.py

# No extras. Proves the near-stdlib claim: the engine must still build a construct
# with only PyYAML present, warning about the gates it cannot run instead of dying.
#
# The pin is ASKED FOR, not restated. This job used to install the literal "PyYAML==6.0.2",
# so bumping requirements.txt would have left CI quietly testing the old version — the same
# defect as two seq_sha256 functions with nothing asserting they agree. bootstrap.py reads
# requirements.txt and needs nothing installed to answer, so it runs on a bare image.
minimal-deps:
  stage: test
  script:
    - pip install --no-cache-dir $(python bootstrap.py --print-required)
    - python test_determinism.py

# Kagami is the tool the wiki invites a visitor to download and run, and until this job
# existed the pipeline said nothing about it: the three jobs above never import it. This
# image has no blastn, which is the point - it is the machine a stranger actually has. The
# suite skips the handful of assertions that need the binary to search UNANNOTATED sequence
# and runs everything else, including the one that matters here: a GenBank whose feature is
# labelled B0032 while its bases are B0034 is still caught, by exact comparison against the
# bundled reference set.
kagami:
  stage: test
  script:
    - cd kagami
    - python tests.py

# bootstrap.py is the first thing a stranger runs, so it must work before anything is
# installed. This job deliberately installs NOTHING: the suite is standard library only,
# because a test that needs pip cannot check an installer. It covers the pure functions —
# the version floor, parsing requirements.txt rather than copying its pins, and the
# per-platform BLAST+ pointer. Creating a venv and running pip are not exercised here;
# that is checked by running bootstrap.py on a clean clone, recorded in the commit.
bootstrap:
  stage: test
  script:
    - python test_bootstrap.py
